name: idolcal

on:
  schedule:
    # 每小时 17 分（UTC）跑一次
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch calendars
        working-directory: idolcal
        run: python build_static.py

      # 写一个心跳文件并提交，避免仓库 60 天无提交导致定时任务被暂停
      - name: Heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: heartbeat" || exit 0
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: idolcal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
